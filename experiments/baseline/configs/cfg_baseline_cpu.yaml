defaults:
  - /arch: trm_cpu
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

data_paths: ['data/sudoku-small']
data_paths_test: []
evaluators: []

global_batch_size: 4
epochs: 20
eval_interval: 5
checkpoint_every_eval: false

lr: 1e-3
lr_min_ratio: 0.1
lr_warmup_steps: 1
beta1: 0.9
beta2: 0.95
weight_decay: 0.01
puzzle_emb_lr: 1e-3
puzzle_emb_weight_decay: 0.01

seed: 0
min_eval_interval: 0
ema: false
freeze_weights: false

project_name: trm-baseline
run_name: baseline-v1
checkpoint_path: checkpoints/baseline-v1

device: cpu
compile_model: false
dataloader_num_workers: 0
cpu_threads: 8
optimizer: adamw
wandb_mode: disabled

