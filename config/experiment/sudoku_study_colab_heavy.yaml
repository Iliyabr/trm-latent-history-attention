# @package _global_
defaults:
  - /arch@arch: trm_history_colab
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

# Same architecture as the short Colab preset so B0 vs P1 stays comparable.
# The short run finished ~1800 steps in ~8 minutes; this budget is ~128×
# more steps so a T4 session hits the wall-clock cap instead of the epoch cap.
data_paths: [data/sudoku-study-v1]
data_paths_test: []
eval_split: dev
evaluators: []

global_batch_size: 32
epochs: 8192
eval_interval: 32
checkpoint_every_eval: true
lr: 1e-4
lr_min_ratio: 0.1
lr_warmup_steps: 500
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_lr: 1e-2
puzzle_emb_weight_decay: 0.1

seed: 0
min_eval_interval: 0
ema: true
ema_rate: 0.999
freeze_weights: false
project_name: trm-latent-history-heavy
run_name: null
checkpoint_path: null
metrics_dir: null
metrics_jsonl: null

device: auto
compile_model: false
dataloader_num_workers: 1
cpu_threads: null
optimizer: adamw
wandb_mode: disabled
# ~11h40m: write runtime_cap.pt before a typical 12h Colab disconnect.
max_runtime_minutes: 700
deterministic: true
best_dev_metric: exact_accuracy
best_dev_mode: max
plateau_patience_evals: 20
