name: recursive_reasoning.trm@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

# TRM_HISTORY_CANONICAL_PROTOCOL_v1 GPU backbone.
halt_exploration_prob: 0.1
halt_max_steps: 6
H_cycles: 3
L_cycles: 6
H_layers: 0
L_layers: 2
hidden_size: 256
num_heads: 4
expansion: 4
puzzle_emb_ndim: ${.hidden_size}
pos_encodings: rope
# Override per hardware: float32 on GTX 1080 Ti, bfloat16 on T4 if verified.
forward_dtype: float32
mlp_t: false
puzzle_emb_len: 16
no_ACT_continue: true

history_enabled: false
history_mode: B0
history_rank: 64
history_heads: 4
# 0 = full causal within-H-cycle history (L_cycles=6 → max queried length 6).
history_window: 0
history_gate_init: -2.0
