name: recursive_reasoning.trm@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

# Colab/T4 scaled study architecture.
halt_exploration_prob: 0.1
halt_max_steps: 6
H_cycles: 2
L_cycles: 4
H_layers: 0
L_layers: 2
hidden_size: 256
num_heads: 4
expansion: 4
puzzle_emb_ndim: ${.hidden_size}
pos_encodings: rope
forward_dtype: bfloat16
mlp_t: false
puzzle_emb_len: 16
no_ACT_continue: true

# Variant is supplied by experiments/run_study.py.
history_enabled: false
history_mode: B0
history_rank: 64
history_heads: 4
history_window: 6
history_gate_init: -2.0
