# @package _global_
defaults:
  - /arch@arch: trm_history_colab
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

# Same D256 / H2 / L4 / ACT6 architecture as config/arch/trm_history_colab.yaml.
# Edit this file for a new long B0 vs P1 run. epochs must be divisible by
# eval_interval. Optimizer steps ≈ epochs * 900 / global_batch_size.

data_paths: [data/sudoku-study-v1]
data_paths_test: []
eval_split: dev
evaluators: []

# --- duration (short Colab suite was epochs=64, eval_interval=4, cap=55) ---
# 1536 epochs ≈ 43k steps ≈ 1.5–2 h on a T4. 1024 ≈ 1 h; 8192 was ~9 h.
epochs: 1536
eval_interval: 64
max_runtime_minutes: 120
checkpoint_every_eval: true

# --- memory / speed ---
global_batch_size: 32          # drop to 16 on CUDA OOM
compile_model: false           # T4 cannot compile bfloat16
dataloader_num_workers: 1

# --- optimizer ---
lr: 1e-4
lr_min_ratio: 0.1
lr_warmup_steps: 500
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_lr: 1e-2
puzzle_emb_weight_decay: 0.1
optimizer: adamw

seed: 0
min_eval_interval: 0
ema: true
ema_rate: 0.999
freeze_weights: false
project_name: trm-latent-history-heavy
run_name: null
checkpoint_path: null
metrics_dir: null
metrics_jsonl: null

device: auto
cpu_threads: null
wandb_mode: disabled
deterministic: true
best_dev_metric: exact_accuracy
best_dev_mode: max
plateau_patience_evals: 20
